[project]
name = "resgap"
version = "0.1.0"
description = "Resilience Gap: an end-to-end pipeline linking NOAA storm losses, FEMA disaster declarations and recorded mitigation obligations, CDC social vulnerability and Census population by U.S. county."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35,<2"]
dashboard = ["streamlit>=1.40,<2", "pandas>=2.2,<3"]
dev = ["pytest>=8.3,<9", "ruff>=0.8", "boto3>=1.35,<2", "moto[s3]>=5,<6", "markdown>=3.7,<4", "pypdf>=5,<7"]

[project.scripts]
resgap = "resgap.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resgap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs RESGAP_TEST_DATABASE_URL (a disposable database; its pipeline schemas are dropped)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
