  bls_cpi:
    provider: U.S. Bureau of Labor Statistics (BLS)
    title: CPI-U, U.S. city average, all items, not seasonally adjusted (series CUUR0000SA0)
    landing_page: https://data.bls.gov/timeseries/CUUR0000SA0
    api_url: https://api.bls.gov/publicAPI/v1/timeseries/data/
    series_id: CUUR0000SA0
    # API v1 needs no registration: 25 queries/day, 10 years and 25 series per query
    # (https://www.bls.gov/developers/api_faqs.htm). A 2000-2025 load uses 4 queries (1990s-2020s:
    # fiscal year 2000 starts in October 1999); the sample and fixture profiles use 1.
    max_years_per_query: 10
    raw_table: raw.bls_cpi_records
    format: JSON (BLS Public Data API v1)
    structure: semi-structured
    allowed_hosts: [api.bls.gov]
    terms: >-
      BLS material is in the public domain; cite the Bureau of Labor Statistics and the retrieval
      date, and state: "BLS.gov cannot vouch for the data or analyses derived from these data
      after the data have been retrieved from BLS.gov." (https://www.bls.gov/developers/termsOfService.htm)
    update_cadence: Monthly CPI release; October 2025 is missing ("Data unavailable due to the 2025 lapse in appropriations").
    health:
      kind: bls_api
      fingerprint: "d8dbf8d3175c7ea9"
      # No independent keyless fallback: the BLS flat files (download.bls.gov) return HTTP 403 to
      # clients that do not send personal contact details, and API v2 requires a personal key.
      fallbacks: []
