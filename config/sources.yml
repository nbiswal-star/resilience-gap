  openfema:
    provider: Federal Emergency Management Agency (FEMA) - OpenFEMA API
    landing_page: https://www.fema.gov/about/openfema/data-sets
    api_base: https://www.fema.gov/api/open
    # Verified fallback: the same records as line-delimited bulk exports
    # (<api_base>/<version>/<Dataset>.jsonl). Field names and values match the API (checked
    # record-by-record on 2026-11-08), so snapshot hashes are identical whichever path is used.
    bulk_format: jsonl
    format: JSON (OData-style REST API; $top max 10000, $skip paging, $count for totals)
    structure: semi-structured
    page_size: 10000
    allowed_hosts: [www.fema.gov]
    terms: >-
      Must state: "This product uses the Federal Emergency Management Agency's OpenFEMA API,
      but is not endorsed by FEMA. The Federal Government or FEMA cannot vouch for the data or
      analyses derived from these data after the data have been retrieved from the Agency's
      website(s)." (https://www.fema.gov/about/openfema/terms-conditions)
    health:
      kind: openfema
      fallbacks: [bulk_jsonl]
    datasets:
      DisasterDeclarationsSummaries:
        version: v2
        data_page: https://www.fema.gov/openfema-data-page/disaster-declarations-summaries-v2
        state_field: state
        date_field: incidentBeginDate
        fingerprint: "30a5033288a03bea"
        update_cadence: catalog accrualPeriodicity R/PT20M (every 20 minutes)
      HmaSubapplications:
        version: v2
        data_page: https://www.fema.gov/openfema-data-page/hma-subapplications-v2
        state_field: subapplicantStateAbbreviation
        year_field: fiscalYear
        fingerprint: "2077b207d17cd0e1"
        update_cadence: catalog accrualPeriodicity R/P1D (daily); dataset lastRefresh 2026-07-27
      DeclarationDenials:
        version: v1
        data_page: https://www.fema.gov/openfema-data-page/declaration-denials-v1
        state_field: stateAbbreviation
        date_field: declarationRequestDate
        fingerprint: "c957f0284494240c"
        update_cadence: catalog accrualPeriodicity R/P1D (daily)

