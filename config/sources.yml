# Source registry: one entry per external dataset.
# Every URL, host and fact here was verified against the live source on 2026-11-08
# (see docs/sources.md). `health` drives `resgap source-check` and the ingestion preflight:
#   allowed_hosts  - every redirect hop and the final URL must stay on these hosts (HTTPS)
#   fingerprint    - hash of the normalised header / record keys observed on 2026-11-08;
#                    a mismatch means the publisher changed the schema (fail fast before download)
#   fallbacks      - only endpoints verified to serve the same content are listed
sources:

  noaa_storm_events:
    provider: NOAA National Centers for Environmental Information (NCEI)
    title: Storm Events Database - bulk CSV "details" files
    landing_page: https://www.ncei.noaa.gov/access/storm-events-database/
    listing_url: https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/
    # File names embed the data year (dYYYY) and a creation date (cYYYYMMDD) that changes
    # whenever NCEI revises that year, so files are discovered from the listing, never hardcoded.
    file_pattern: 'StormEvents_details-ftp_v1\.0_d(?P<year>\d{4})_c(?P<created>\d{8})\.csv\.gz'
    format: csv.gz
    structure: structured
    raw_table: raw.noaa_storm_events_details
    allowed_hosts: [www.ncei.noaa.gov]
    terms: >-
      U.S. federal government data (NOAA/NCEI); no use restriction is stated in the bulk-download
      README. Cite NCEI Storm Events Database and do not imply NOAA endorsement.
    update_cadence: Current-year file regenerated monthly; prior years revised in place (new cYYYYMMDD).
    health:
      kind: noaa_listing
      fingerprint: "b96502785a9d4333"
      # www1.ncdc.noaa.gov/pub/... only redirects to the same NCEI path (verified), so it is not an
      # independent fallback. Already-downloaded files in the object store are reused instead.
      fallbacks: []

  nws_zone_county:
    provider: NOAA National Weather Service (NWS) GIS
    title: County - Public Forecast Zones Correlation file (versioned snapshots)
    landing_page: https://www.weather.gov/gis/ZoneCounty
    base_url: https://www.weather.gov/source/gis/Shapefiles/County/
    file_pattern: 'bp\d{2}[a-z]{2}\d{2}\.dbx'
    # Not linked from the landing page but served by NWS (HTTP 200 verified 2026-11-08).
    nws_hosted_files: [bp03mr20.dbx, bp10nv20.dbx, bp30mr21.dbx, bp08se21.dbx, bp22mr22.dbx,
                       bp13se22.dbx, bp08mr23.dbx, bp19se23.dbx, bp05mr24.dbx, bp10se24.dbx]
    # Published by NWS but never in effect, so never used as a snapshot:
    excluded_files:
      bp03mr26.dbx: "planned 2026 version; NWS moved the implementation to 16 Apr 2026 (bp16ap26)"
      bp07se22.dbx: "superseded six days later by the NWS-hosted bp13se22; no evidence it took effect"
    # A snapshot whose successor is more than this many days later sits in a documented gap
    # (no intermediate version found); zone matches inside a gap must be name-verified.
    gap_threshold_days: 400
    format: pipe-delimited text, no header
    columns: [state, zone, cwa, name, state_zone, county, fips, time_zone, fe_area, lat, lon]
    structure: structured (reference crosswalk)
    raw_table: raw.nws_zone_county
    allowed_hosts: [www.weather.gov]
    terms: >-
      NWS web information is public domain unless noted; do not claim it as your own or imply
      NOAA/NWS endorsement (https://www.weather.gov/disclaimer).
    update_cadence: New file when forecast zones change (2020-2026 versions are NWS-hosted).
    archive:
      # Versions before 2020 are no longer on NWS servers (HTTP 404). The Internet Archive holds
      # byte-for-byte captures of the original NWS URLs; each download is verified against the
      # archive's SHA-1 digest and kept with provenance_tier = internet_archive. Discovery used
      # the archive's CDX index; no version between Apr 2017 and Mar 2020 was ever captured.
      enabled: true
      allowed_hosts: [web.archive.org]
      url_template: "https://web.archive.org/web/{timestamp}id_/{original}"
