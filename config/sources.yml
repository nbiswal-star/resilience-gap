    partition: release=2022
    encoding: utf-8-sig
    format: csv
    structure: structured
    raw_table: raw.cdc_svi_county
    missing_value_sentinel: "-999"
    allowed_hosts: [svi.cdc.gov]
    terms: >-
      U.S. federal government data; CDC/ATSDR publishes a suggested citation on the download page.
    update_cadence: Biennial releases (2022 is the latest listed as of 2026-11-08).
    health: {kind: csv_header, fingerprint: "5e0a192d79f3bace", fallbacks: []}

  cdc_svi_pr:
    provider: CDC / ATSDR GRASP
    title: CDC/ATSDR SVI 2022 - Puerto Rico municipios (stand-alone Puerto Rico ranking)
    landing_page: https://svi.cdc.gov/dataDownloads/data-download.html
    documentation: https://www.atsdr.cdc.gov/place-health/media/pdfs/2024/10/SVI2022Documentation.pdf
    # From the documentation: "a stand-alone, state-specific Commonwealth of Puerto Rico database.
    # Puerto Rico is not included in the U.S.-wide ranking." The download tool lists Puerto Rico
    # as the only territory. Scores are therefore NOT comparable with national percentiles.
    url: https://svi.cdc.gov/Documents/Data/2022/csv/states_counties/PuertoRico_county.csv
    partition: release=2022-puerto-rico
    encoding: utf-8-sig
    format: csv (same 158 columns as the U.S. file)
    structure: structured
    raw_table: raw.cdc_svi_county
    allowed_hosts: [svi.cdc.gov]
    terms: U.S. federal government data; cite CDC/ATSDR SVI.
    update_cadence: Released with each SVI edition.
    health: {kind: csv_header, fingerprint: "5e0a192d79f3bace", fallbacks: []}

